---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: ${APP}
spec:
  mover:
    securityContext:
      runAsUser: ${KOPIUR_PUID:-568}
      runAsGroup: ${KOPIUR_PGID:-568}
    podSecurityContext:
      fsGroup: ${KOPIUR_FSGROUP:-568}
      fsGroupChangePolicy: OnRootMismatch
      supplementalGroups: [568]
  policy:
    onMissingSnapshot: Continue
  repository:
    kind: ClusterRepository
    name: ${KOPIUR_RESTORE_REPOSITORY:-truenas}
  source:
    fromPolicy:
      name: ${APP}
      offset: 0
  target:
    populator: {}
